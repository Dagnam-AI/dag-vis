name: CI

# Public repo, so these runs are real evidence. The release workflow calls
# this file, so a tag cannot publish a commit these jobs would have failed.
# The gallery job drives the demo in headless Chromium (software WebGL).
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Least privilege: no job here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, format, types, tests at 100% coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # The dev/CI toolchain needs Node >= 22.12 (vitest 5). The package's own
      # `engines.node >=22` is the floor for consumers, who run the built dist/.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # The Node export helpers pipe frames into the ffmpeg binary. Tests that
      # encode for real need one on PATH; the mocked pipe tests do not.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # eslint (layer rules) -> prettier --check -> tsc --noEmit -> vitest at
      # 100/100/100/100, the same gate as `npm run check` locally.
      - run: npm run check

      # Goldens are generated artifacts. tests/helpers/golden.ts WRITES a golden
      # that does not exist yet and passes, so a PR that adds a golden test but
      # forgets the file would be green; `git diff` cannot see an untracked
      # file. `git status` sees both a rewritten (modified) golden and a
      # created (untracked) one. UPDATE_GOLDENS is never set in CI.
      - name: Assert the run neither rewrote nor created a golden
        run: |
          changed=$(git status --porcelain -- tests/goldens)
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::the test run changed tests/goldens (listed above): commit the golden files with the change that needs them (UPDATE_GOLDENS=1 npx vitest run), or fix the output that drifted"
            exit 1
          fi

  package:
    name: Build, pack, install in isolation, run the CLI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci && npm run build

      # What ships is asserted by a script shared with release.yml, so the
      # tarball that gets published is held to the same list: the bundled
      # fonts and bin are inside; no tests, sources, coverage output or source
      # maps ride along.
      - name: Pack and assert what ships
        run: |
          tarball="$PWD/$(npm pack --silent)"
          bash .github/scripts/assert-tarball.sh "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_ENV"

      # A consumer gets the tarball plus (optionally) the native rasteriser.
      # Exercise every entry from an empty directory: the browser-safe root
      # without resvg or react installed, the animate and react entries, then
      # the node entry + CLI with resvg.
      - name: Install in isolation and smoke both entries
        run: |
          cd "$(mktemp -d)"
          npm init -y >/dev/null
          npm pkg set type=module >/dev/null
          npm install "$tarball" >/dev/null

          # Browser-safe means the root entry's import graph never reaches a
          # Node builtin, the node, animate or react entries or the native
          # rasteriser (the animate types name HTMLCanvasElement, so the root
          # must not pull them in), nor the export layer (it loads the
          # third-party encoders), and has no bare import at all. The animate
          # entry may import only the export dependencies named below (no
          # react, no other bare import). Walk both.
          cat > root-graph.mjs <<'EOF'
          import { readFileSync } from "node:fs";
          import { dirname, resolve } from "node:path";
          import { fileURLToPath } from "node:url";
          const dist = resolve(fileURLToPath(import.meta.url), "../node_modules/@dagnam/vis/dist");
          const graph = (entry, forbidden, min, bare = []) => {
          const seen = new Set();
          const walk = (file) => {
            if (seen.has(file)) return;
            seen.add(file);
            const src = readFileSync(file, "utf8");
            // Static import/export-from, side-effect import, dynamic import().
            const edge = /^(?:import|export)\s*(?:type\s+)?(?:\*(?:\s+as\s+\w+)?|\{[^}]*\}|[\w$]+)\s*from\s*["']([^"']+)["']|^import\s*["']([^"']+)["']|\bimport\(\s*["']([^"']+)["']\s*\)/gm;
            for (const m of src.matchAll(edge)) {
              const spec = m[1] ?? m[2] ?? m[3];
              if (!spec.startsWith(".")) {
                if (bare.includes(spec)) continue;
                throw new Error(`${file} imports ${spec}`);
              }
              const target = resolve(dirname(file), spec);
              for (const layer of forbidden)
                if (target.startsWith(resolve(dist, layer))) throw new Error(`${file} reaches the ${layer} layer: ${spec}`);
              walk(target);
            }
          };
          walk(resolve(dist, entry));
          // A regex that stopped matching would pass vacuously: insist on a real graph.
          if (seen.size < min) throw new Error(`only ${seen.size} modules found from ${entry}; the walker is broken`);
          console.log(`${entry} graph ok: ${seen.size} modules, no node: / resvg / ${forbidden.join(", ")} layer`);
          };
          graph("index.js", ["node", "animate", "react", "export"], 30);
          // The only third-party code the package ships, listed by name: a new
          // bare import anywhere else fails here until it is added on purpose.
          graph("animate/index.js", ["node", "react"], 10, ["gifenc", "mp4-muxer", "webm-muxer"]);
          EOF
          node root-graph.mjs

          cat > root.mjs <<'EOF'
          import { brandBackground, fieldPresets, gradient, ogCard, pattern, renderField, ribbon } from "@dagnam/vis";
          const svg = brandBackground({ width: 1200, height: 630 });
          if (!svg.startsWith("<svg")) throw new Error("brandBackground did not render");
          if (!gradient({ kind: "linear", stops: ["#ef4444", "#10abba"] }).css.startsWith("background:")) throw new Error("gradient");
          if (!pattern({ kind: "dagMesh" }).cssBackground.startsWith("url(")) throw new Error("pattern");
          if (!ogCard({ title: "Smoke" }).includes("Smoke")) throw new Error("ogCard");
          if (!ribbon({ width: 100, height: 50, lines: 4, samples: 8 }).includes("<path")) throw new Error("ribbon");
          if (renderField(fieldPresets.lunar, { width: 8, height: 4 }).data.length !== 8 * 4 * 4) throw new Error("renderField");
          console.log("root ok:", svg.length, "bytes");
          EOF
          node root.mjs

          # The animate entry imports in plain Node (no DOM, no react installed):
          # importing creates nothing, and a wrapper-free call is pure.
          cat > animate.mjs <<'EOF'
          import * as animate from "@dagnam/vis/animate";
          import * as root from "@dagnam/vis";
          for (const name of ["createDither", "createPixelBlast", "createTerminal", "createGlitch", "createRibbon", "createField", "exportCanvas"])
            if (typeof animate[name] !== "function") throw new Error(`${name} missing from @dagnam/vis/animate`);
          if (animate.loopTime(5, { duration: 2 }) !== 1) throw new Error("loopTime");
          if ("createDither" in root) throw new Error("the root must not export the animate effects");
          console.log("animate ok, react not installed");
          EOF
          node animate.mjs

          # gifenc has no exports map: plain Node loads its CommonJS file, where
          # named imports do not exist. Encode one real GIF from the installed
          # tarball to prove the interop shim works outside a bundler. The file
          # is imported by path because the encoders have no public subpath.
          cat > gif.mjs <<'EOF'
          import { resolve } from "node:path";
          import { pathToFileURL } from "node:url";
          const { encodeGif } = await import(pathToFileURL(resolve("node_modules/@dagnam/vis/dist/export/gif.js")).href);
          const frame = (i) => {
            const d = new Uint8Array(4 * 4 * 4);
            for (let p = 0; p < 16; p++) d.set([i * 60, p * 16, 200, 255], p * 4);
            return d;
          };
          const bytes = await encodeGif({ width: 4, height: 4, fps: 10, count: 3, frameAt: frame });
          if (new TextDecoder().decode(bytes.subarray(0, 6)) !== "GIF89a") throw new Error("not a GIF");
          if (bytes.at(-1) !== 0x3b) throw new Error("GIF has no trailer");
          console.log("gif ok:", bytes.length, "bytes through gifenc in plain Node");
          EOF
          node gif.mjs

          # The export declarations must not name a bare module: gifenc ships
          # without types, so a consumer type-checking one would hit TS7016.
          if grep -En "(from|import)[ (]*[\"'][^.\"']" node_modules/@dagnam/vis/dist/export/*.d.ts; then
            echo "dist/export declarations import a bare module" >&2
            exit 1
          fi
          echo "export declarations ok: no bare import"

          cat > node-missing.mjs <<'EOF'
          import { renderPng } from "@dagnam/vis/node";
          try { await renderPng("<svg xmlns='http://www.w3.org/2000/svg'/>"); throw new Error("expected a VisError"); }
          catch (e) { if (e.name !== "VisError" || !e.message.includes("@resvg/resvg-js")) throw e; console.log("node entry loads without resvg and says what to install"); }
          EOF
          node node-missing.mjs

          # The shipped .d.ts must resolve for a strict TypeScript consumer
          # (skipLibCheck stays off, so a broken declaration fails here). This
          # first consumer is Node-only: `lib` is ES2022 WITHOUT the DOM, and it
          # imports only the root and the node entry, so a root declaration that
          # names a DOM type (HTMLCanvasElement) fails it with TS2304.
          npm install --save-dev typescript@5.9.3 @types/node@22.20.5 >/dev/null
          cat > consumer.ts <<'EOF'
          import { gradient, ogCard, VisError } from "@dagnam/vis";
          import type { GradientSpec } from "@dagnam/vis";
          import { renderField, fieldPresets } from "@dagnam/vis";
          import type { FieldFrame } from "@dagnam/vis";
          import { exportStatic, favicons, renderPng } from "@dagnam/vis/node";
          const frame: FieldFrame = renderField(fieldPresets.lunar, { width: 8, height: 4 });
          const still: Promise<void> = exportStatic(fieldPresets.lunar, { width: 8, height: 4, format: "png", out: "still.png" });
          export { frame, still };
          const spec: GradientSpec = { kind: "linear", stops: ["#ef4444", "#10abba"] };
          const css: string = gradient(spec).css;
          const card: string = ogCard({ title: css.slice(0, 4) });
          const png: Promise<Buffer> = renderPng(card, { width: 600 });
          const written: Promise<string[]> = favicons({ outDir: "icons" });
          export { png, written, VisError };
          EOF
          cat > tsconfig.json <<'EOF'
          { "compilerOptions": { "module": "NodeNext", "moduleResolution": "NodeNext", "target": "ES2022", "lib": ["ES2022"], "strict": true, "noEmit": true, "skipLibCheck": false, "types": ["node"] }, "files": ["consumer.ts"] }
          EOF
          npx tsc -p tsconfig.json
          echo "types ok (Node-only consumer, no DOM lib)"

          # A browser consumer (DOM lib) of the animate and react entries.
          npm install --save-dev react@19.3.1 @types/react@19.3.0 >/dev/null
          cat > consumer-dom.tsx <<'EOF'
          import { createDither, createField, exportCanvas, type EffectHandle, type DitherOptions } from "@dagnam/vis/animate";
          import { fieldPresets } from "@dagnam/vis";
          import { VisBackground, Gradient } from "@dagnam/vis/react";
          const handle: EffectHandle<DitherOptions> = createDither(document.createElement("canvas"), { colors: ["#e64040"] });
          handle.renderAt(1);
          const field = createField(document.createElement("canvas"), fieldPresets.lunar, { loop: { duration: 6 } });
          export const clip: Promise<Blob> = exportCanvas(field, { format: "mp4", duration: 6 });
          export const view = (
            <>
              <VisBackground effect="dither" options={{ waveSpeed: 0.15 }} />
              <Gradient spec={{ kind: "linear", stops: ["#ef4444", "#10abba"] }} />
            </>
          );
          EOF
          cat > tsconfig.dom.json <<'EOF'
          { "compilerOptions": { "module": "NodeNext", "moduleResolution": "NodeNext", "target": "ES2022", "lib": ["ES2022", "DOM"], "jsx": "react-jsx", "strict": true, "noEmit": true, "skipLibCheck": false, "types": [] }, "files": ["consumer-dom.tsx"] }
          EOF
          npx tsc -p tsconfig.dom.json
          echo "types ok (DOM consumer of animate and react)"
          node --input-type=module -e 'const r = await import("@dagnam/vis/react"); if (typeof r.VisBackground !== "function" || typeof r.Gradient !== "function") throw new Error("react entry"); console.log("react entry ok")'

          npm install @resvg/resvg-js@2.6.2 >/dev/null
          npx dag-vis --help | head -1
          npx dag-vis og --title "CI smoke" --out out/og.png
          npx dag-vis favicons --out out/icons
          node -e "const b=require('fs').readFileSync('out/og.png'); if(b.readUInt32BE(16)!==1200) throw new Error('png width'); console.log('cli ok')"
          test -s out/icons/favicon.ico && test -s out/icons/site.webmanifest

  gallery:
    name: Gallery smoke in headless Chromium, screenshots for review
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # The Chromium revision is pinned by the exact @playwright/test version in
      # package-lock.json; --with-deps adds the system libraries it needs.
      - run: npx playwright install --with-deps chromium

      # Starts the Vite demo itself (playwright.config.ts webServer) and checks
      # every effect renders a non-blank, deterministic frame. Screenshots are
      # artifacts for a human, never compared against a baseline.
      - run: npm run test:e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gallery-screenshots
          path: screenshots/
          retention-days: 7
          if-no-files-found: warn

      # Traces of failing tests (playwright.config.ts: retain-on-failure).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: gallery-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
