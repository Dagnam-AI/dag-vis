name: Release @dagnam/vis

# One tag publishes the package. The prefix mirrors dag-lib (`dagnam/v*`) and
# dag-contracts (`contracts/v*`), so a glance at a tag says what it released.
# Only a `vis/v*` tag triggers this: a push to a branch never publishes.
#
# Protection that is in place (the checks in this file are NOT a security
# boundary: they live in the tagged commit's own copy of this workflow, so
# anyone who can push a branch and a tag can edit or delete them):
#   - A GitHub tag ruleset on `vis/v*` restricts who can create such a tag,
#     since creating one starts a release.
#   - The `publish` job runs in the `npm` GitHub Environment, which exists and
#     is limited to `vis/v*` tags, so a run from any other ref cannot use it
#     (or any secret stored on it).
# Owner setup still required on npmjs.com: the trusted publisher configuration
# for @dagnam/vis must name workflow `release.yml` and environment `npm`; and
# the first publish of a new package name needs the NPM_TOKEN fallback below.
on:
  push:
    tags:
      - "vis/v*"

# npm refuses to publish over an existing version, so a started upload must
# finish: cancel-in-progress is false on purpose.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Default for every job; the job that mints an OIDC token says so itself.
permissions:
  contents: read

jobs:
  # The whole CI workflow (check + packed-tarball smoke), on the tagged commit.
  # npm never takes a version back, so nothing below starts until it is green.
  ci:
    name: CI on the tagged commit
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The protected Environment (limited to `vis/v*` tags); npm's trusted
    # publisher configuration names it.
    environment: npm
    permissions:
      contents: read
      # Mints the OIDC token npm trusted publishing exchanges for a short-lived
      # publish credential, and the one the provenance attestation is signed with.
      id-token: write
    steps:
      # Only plain X.Y.Z tags are supported. A prerelease tag such as
      # vis/v0.2.0-rc.1 would publish to the `latest` dist-tag (no `--tag` is
      # passed), so it is refused before anything else happens.
      - name: Assert the tag is exactly vis/v<digits>.<digits>.<digits>
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^vis/v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::tag '$GITHUB_REF_NAME' is not vis/vX.Y.Z; prerelease and other suffixes are not supported by this workflow"; exit 1; }

      # Full history, so the ancestry check below can answer. Credentials are
      # not persisted: no later step pushes, and the fetch below reads a PUBLIC
      # repository, which GitHub serves anonymously.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # A release is a tag on `main`. This stops an ACCIDENTAL tag on an
      # unmerged branch; it does not stop a malicious one, because the check is
      # part of the tagged commit's own workflow file (see the protection notes
      # at the top). Refresh origin/main first (the checkout may be older than
      # the tag push).
      - name: Assert the tagged commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          # HEAD is the tagged commit (GITHUB_SHA, peeled if the tag is annotated).
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "::error::$(git rev-parse HEAD) (tag $GITHUB_REF_NAME) is not an ancestor of origin/main; release only commits that are on main"; exit 1; }

      # No `cache: npm` here: this job publishes, and a restorable cache is an
      # input an attacker who can write it could use to alter what ships.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12"
          registry-url: https://registry.npmjs.org

      # package.json is the single source of the version; the tag must agree
      # BEFORE anything is built, since npm never takes a version back.
      - name: Assert package.json claims the tag's version
        run: |
          tag="${GITHUB_REF_NAME#vis/v}"
          js=$(node -p "require('./package.json').version")
          echo "tag=$tag  package.json=$js"
          [ "$js" = "$tag" ] || { echo "::error::package.json says $js, tag says $tag"; exit 1; }

      # OIDC trusted publishing needs npm >= 11.5.1; the npm bundled with the
      # runner's Node predates it and would 403 looking for a token this job
      # does not have. Pin the major (not @latest, which would move under a
      # release) and assert the floor, so a future npm@11 line cannot silently
      # fall below it.
      - name: Install an npm that supports trusted publishing
        run: |
          npm install -g npm@11
          v=$(npm --version)
          echo "npm $v"
          [ "$(printf '%s\n' 11.5.1 "$v" | sort -V | head -n1)" = "11.5.1" ] \
            || { echo "::error::npm $v is older than 11.5.1, which trusted publishing needs"; exit 1; }

      # --ignore-scripts: nothing in the dependency tree needs an install
      # script to build, and a publish job holding an OIDC token should not run
      # third-party lifecycle scripts.
      - run: npm ci --ignore-scripts && npm run build

      # Publish the exact tarball that was inspected: pack once, hold it to the
      # same assertions CI's package job uses, then publish that file (npm
      # publish <tarball> uploads it as is, so nothing is rebuilt in between).
      #
      # Credential: trusted publishing (OIDC). Configure the trusted publisher
      # once on npmjs.com for @dagnam/vis (repository Dagnam-AI/dag-vis,
      # workflow release.yml, environment npm); no secret is stored anywhere
      # and the OIDC token lives for this job only. The FIRST publish of a new
      # package name cannot use it (the package must exist before a trusted
      # publisher can be attached on npmjs.com), which is what the fallback is
      # for.
      #
      # Fallback: an `NPM_TOKEN` secret holding a short-lived granular access
      # token with publish rights on the @dagnam scope and 2FA bypass (classic
      # and automation tokens are not the right thing any more). It may be
      # stored as an Environment secret on `npm` (readable only by runs the
      # Environment admits, i.e. `vis/v*` tags) instead of a repository
      # secret; the `secrets.NPM_TOKEN` reference below reads either. Use it
      # only until trusted publishing is configured, then delete the secret: a
      # long-lived token is the hole OIDC exists to close. When the secret is
      # set it is the credential; when it is absent the step is the OIDC path.
      #
      # `--provenance` signs a build attestation (needs id-token: write above).
      # Idempotent on re-runs: a moved tag must skip a version npm already has
      # instead of failing on it.
      - name: Pack, assert and publish (skips a version npm already has)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          tarball="$RUNNER_TEMP/$(npm pack --silent --pack-destination "$RUNNER_TEMP")"
          bash .github/scripts/assert-tarball.sh "$tarball"
          version=$(node -p "require('./package.json').version")
          if npm view "@dagnam/vis@${version}" version >/dev/null 2>&1; then
            echo "@dagnam/vis@${version} is already on npm; skipping publish"
          elif [ -n "$NPM_TOKEN" ]; then
            echo "publishing with the NPM_TOKEN fallback"
            NODE_AUTH_TOKEN="$NPM_TOKEN" npm publish "$tarball" --provenance --access public
          else
            echo "publishing with npm trusted publishing (OIDC)"
            npm publish "$tarball" --provenance --access public
          fi
